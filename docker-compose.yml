x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: xellabs_lims
      POSTGRES_USER: xellabs_user
      POSTGRES_PASSWORD: "${DB_PASSWORD:-3333}"
    ports:
      - "127.0.0.1:15432:5432"   # host port 5432 is taken by a native Windows PostgreSQL 18 service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xellabs_user -d xellabs_lims"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    mem_limit: 1g

  redis:
    image: redis:7
    restart: unless-stopped
    command: >
      redis-server --requirepass "${REDIS_PASSWORD:-3333}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-3333}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    mem_limit: 384m

  django:
    build:
      context: ./xellabs-backend
    restart: unless-stopped
    env_file:
      - path: ./xellabs-backend/.env
        required: false
    environment:
      DB_NAME: xellabs_lims
      DB_USER: xellabs_user
      DB_PASSWORD: "${DB_PASSWORD:-3333}"
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-3333}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-3333}@redis:6379/0
      SENAITE_URL: http://senaite:8080/senaite
      SENAITE_USER: admin
      SENAITE_PASSWORD: "${SENAITE_ADMIN_PASSWORD:-admin}"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./xellabs-backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate_schemas --shared --noinput &&
             python manage.py migrate_schemas --noinput &&
             python manage.py runserver 0.0.0.0:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys,urllib.error;\ntry:\n  urllib.request.urlopen('http://localhost:8001/admin/login/', timeout=3)\n  sys.exit(0)\nexcept urllib.error.HTTPError as e:\n  sys.exit(0 if e.code < 500 else 1)\nexcept Exception:\n  sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    mem_limit: 1g

  celery:
    build:
      context: ./xellabs-backend
    restart: unless-stopped
    env_file:
      - path: ./xellabs-backend/.env
        required: false
    environment:
      DB_NAME: xellabs_lims
      DB_USER: xellabs_user
      DB_PASSWORD: "${DB_PASSWORD:-3333}"
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-3333}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-3333}@redis:6379/0
      SENAITE_URL: http://senaite:8080/senaite
      SENAITE_USER: admin
      SENAITE_PASSWORD: "${SENAITE_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./xellabs-backend:/app
    depends_on:
      django:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      watchmedo auto-restart
        --directory=/app
        --pattern=*.py
        --recursive
        --
        celery -A config worker --loglevel=info --concurrency=4
    logging: *default-logging
    mem_limit: 1g

  celery-beat:
    build:
      context: ./xellabs-backend
    restart: unless-stopped
    env_file:
      - path: ./xellabs-backend/.env
        required: false
    environment:
      DB_NAME: xellabs_lims
      DB_USER: xellabs_user
      DB_PASSWORD: "${DB_PASSWORD:-3333}"
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-3333}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-3333}@redis:6379/0
      SENAITE_URL: http://senaite:8080/senaite
      SENAITE_USER: admin
      SENAITE_PASSWORD: "${SENAITE_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./xellabs-backend:/app
    depends_on:
      django:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info
    logging: *default-logging
    mem_limit: 512m

  senaite:
    build:
      context: ./senaite-rebrand
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SITE=senaite
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=${SENAITE_ADMIN_PASSWORD:-admin}
    volumes:
      - senaite_data:/data
    healthcheck:
      test: ["CMD", "python2.7", "-c", "import urllib2,sys; sys.exit(0 if urllib2.urlopen('http://localhost:8080/senaite', timeout=5).getcode() < 500 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *default-logging
    mem_limit: 2g

  frontend:
    build:
      context: ./xellabs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DJANGO_API_URL=http://django:8001
      - SENAITE_URL=http://senaite:8080/senaite
      - SESSION_SECRET=${SESSION_SECRET}
      - DJANGO_SERVICE_TOKEN=${DJANGO_SERVICE_TOKEN}
      - DEFAULT_TENANT_SCHEMA=hl-01
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - ./xellabs-frontend:/app   # source mount — build runs against latest code on every container start
      - /app/node_modules         # preserve packages installed during image build
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s
    logging: *default-logging
    mem_limit: 2g

volumes:
  postgres_data:
  senaite_data:
