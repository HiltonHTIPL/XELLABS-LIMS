x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: xellabs_lims
      POSTGRES_USER: xellabs_user
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:15432:5432"   # host port 5432 is taken by a native Windows PostgreSQL 18 service
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xellabs_user -d xellabs_lims"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    mem_limit: 1g

  redis:
    image: redis:7
    restart: unless-stopped
    command: >
      redis-server --requirepass "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging
    mem_limit: 384m

  django:
    build:
      context: ./xellabs-backend
    restart: unless-stopped
    env_file:
      - path: ./xellabs-backend/.env
        required: false
    environment:
      DB_NAME: xellabs_lims
      DB_USER: xellabs_user
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      SENAITE_URL: "${SENAITE_URL:-http://senaite:8080/senaite}"
      SENAITE_USER: admin
      SENAITE_PASSWORD: "${SENAITE_ADMIN_PASSWORD:?SENAITE_ADMIN_PASSWORD must be set in .env}"
      # Platform superadmin — created/re-synced on every start by ensure_superuser.
      # Set real values in the project-root .env; never commit them.
      DJANGO_SUPERUSER_USERNAME: "${DJANGO_SUPERUSER_USERNAME:?DJANGO_SUPERUSER_USERNAME must be set in .env}"
      DJANGO_SUPERUSER_PASSWORD: "${DJANGO_SUPERUSER_PASSWORD:-}"
      DJANGO_SUPERUSER_EMAIL: "${DJANGO_SUPERUSER_EMAIL:?DJANGO_SUPERUSER_EMAIL must be set in .env}"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./xellabs-backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate_schemas --shared --noinput &&
             python manage.py migrate_schemas --noinput &&
             python manage.py ensure_superuser &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8001 --workers 2 --timeout 120 --access-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys,urllib.error;\ntry:\n  urllib.request.urlopen('http://localhost:8001/admin/login/', timeout=3)\n  sys.exit(0)\nexcept urllib.error.HTTPError as e:\n  sys.exit(0 if e.code < 500 else 1)\nexcept Exception:\n  sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging
    mem_limit: 1g

  celery:
    build:
      context: ./xellabs-backend
    restart: unless-stopped
    env_file:
      - path: ./xellabs-backend/.env
        required: false
    environment:
      DB_NAME: xellabs_lims
      DB_USER: xellabs_user
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      SENAITE_URL: "${SENAITE_URL:-http://senaite:8080/senaite}"
      SENAITE_USER: admin
      SENAITE_PASSWORD: "${SENAITE_ADMIN_PASSWORD:?SENAITE_ADMIN_PASSWORD must be set in .env}"
    volumes:
      - ./xellabs-backend:/app
    depends_on:
      django:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      watchmedo auto-restart
        --directory=/app
        --pattern=*.py
        --recursive
        --
        celery -A config worker --loglevel=info --concurrency=4
    logging: *default-logging
    mem_limit: 1g

  # Dedicated worker for report generation (queue="reports" in reporting/tasks.py) so a
  # report request is never stuck waiting behind the periodic SENAITE sync sweep, which
  # runs on the default queue every 5 minutes across every tenant schema.
  celery-reports:
    build:
      context: ./xellabs-backend
    restart: unless-stopped
    env_file:
      - path: ./xellabs-backend/.env
        required: false
    environment:
      DB_NAME: xellabs_lims
      DB_USER: xellabs_user
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      SENAITE_URL: "${SENAITE_URL:-http://senaite:8080/senaite}"
      SENAITE_USER: admin
      SENAITE_PASSWORD: "${SENAITE_ADMIN_PASSWORD:?SENAITE_ADMIN_PASSWORD must be set in .env}"
    volumes:
      - ./xellabs-backend:/app
    depends_on:
      django:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      watchmedo auto-restart
        --directory=/app
        --pattern=*.py
        --recursive
        --
        celery -A config worker --loglevel=info --concurrency=2 --queues=reports -n reports@%h
    logging: *default-logging
    mem_limit: 1g

  celery-beat:
    build:
      context: ./xellabs-backend
    restart: unless-stopped
    env_file:
      - path: ./xellabs-backend/.env
        required: false
    environment:
      DB_NAME: xellabs_lims
      DB_USER: xellabs_user
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      DB_HOST: postgres
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      SENAITE_URL: "${SENAITE_URL:-http://senaite:8080/senaite}"
      SENAITE_USER: admin
      SENAITE_PASSWORD: "${SENAITE_ADMIN_PASSWORD:?SENAITE_ADMIN_PASSWORD must be set in .env}"
    volumes:
      - ./xellabs-backend:/app
    depends_on:
      django:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat --loglevel=info
    logging: *default-logging
    mem_limit: 512m

  senaite:
    build:
      context: ./senaite-rebrand
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SITE=senaite
      - PASSWORD=${SENAITE_ADMIN_PASSWORD:?SENAITE_ADMIN_PASSWORD must be set in .env}
      # senaite.storage add-on — installed via the base image's built-in
      # docker-initialize.py mechanism (reads ADDONS/VERSIONS, runs buildout
      # on first boot of a fresh container). Profile defaults to
      # senaite.storage:default automatically since PROFILES isn't set.
      - ADDONS=senaite.storage
      - VERSIONS=senaite.storage=2.6.0
    volumes:
      - senaite_data:/data
    healthcheck:
      test: ["CMD", "python2.7", "-c", "import urllib2,sys; sys.exit(0 if urllib2.urlopen('http://localhost:8080/senaite', timeout=5).getcode() < 500 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *default-logging
    mem_limit: 2g

  frontend:
    build:
      context: ./xellabs-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"   # reach the app at http://127.0.0.1:3000 (and http://<host-lan-ip>:3000 on the LAN)
    environment:
      - DJANGO_API_URL=http://django:8001
      - SENAITE_URL=${SENAITE_URL:-http://senaite:8080/senaite}
      - SENAITE_ADMIN_USER=${SENAITE_ADMIN_USER:?SENAITE_ADMIN_USER must be set in .env}
      - SENAITE_ADMIN_PASS=${SENAITE_ADMIN_PASS:?SENAITE_ADMIN_PASS must be set in .env}
      - SESSION_SECRET=${SESSION_SECRET}
      - DJANGO_SERVICE_TOKEN=${DJANGO_SERVICE_TOKEN}
      # DEFAULT_TENANT_SCHEMA intentionally NOT set — never hardcode a tenant here.
      # The tenant comes from the login subdomain (e.g. mylab.localhost:3000) and is
      # stored in the session. Set it via the root .env only if a dev default is needed.
      - DEFAULT_TENANT_SCHEMA=${DEFAULT_TENANT_SCHEMA:-}
      - NODE_ENV=${NODE_ENV:-production}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}   # LAN access is plain HTTP; secure cookies would be dropped and break login. Set true only behind real TLS.
      - NEXT_PUBLIC_APP_ENV=${NEXT_PUBLIC_APP_ENV:-development}
    volumes:
      - ./xellabs-frontend:/app   # source mount — build runs against latest code on every container start
      - /app/node_modules         # preserve packages installed during image build
      - frontend_next_cache:/app/.next/cache   # persist webpack/SWC build cache across recreates — speeds up rebuilds without serving stale output (source is still re-read fresh every time)
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 120s
    logging: *default-logging
    mem_limit: 6g

  # pgbouncer: intentionally removed (2026-07-08) — `bitnami/pgbouncer` no longer resolves
  # on Docker Hub under any tag (Bitnami restructured their image catalog); nothing in this
  # compose file was actually wired to use it yet (every service's DB_HOST is still `postgres`
  # directly), so it was dead, non-functional weight blocking `docker compose up --build`
  # entirely. Re-add with a working pgbouncer image (e.g. `edoburu/pgbouncer`) if connection
  # pooling is needed later — remember to also update DB_HOST/DB_PORT on django/celery/
  # celery-reports/celery-beat to point at it.

volumes:
  postgres_data:
  senaite_data:
  frontend_next_cache:
